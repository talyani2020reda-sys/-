<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e3b33">
<title>مولّد الأبحاث الجامعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green:#0e3b33; --green-d:#082b25; --sage:#edf1ee; --paper:#fff;
    --ink:#15201c; --muted:#55645e; --line:#c9d3cd; --brass:#b08a3e;
    --danger:#9f1d14; --danger-bg:#fbeae8;
    --serif:'Amiri','Traditional Arabic',serif;
    --sans:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--sage); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.75; }

  /* الترويسة */
  .top { background:var(--green); color:#fff; border-bottom:4px solid var(--brass); }
  .top-in { max-width:760px; margin:0 auto; padding:28px 16px 26px; display:flex; gap:16px; align-items:center; }
  .top svg { flex:none; width:54px; height:54px; stroke:#e7d3a3; }
  h1 { font-family:var(--serif); font-weight:700; font-size:clamp(28px,7vw,40px); line-height:1.35; margin:0; }
  .sub { margin:4px 0 0; color:#c4d4cd; font-size:15px; }

  main { max-width:760px; margin:0 auto; padding:24px 16px 96px; }

  /* الخطوات */
  .step { position:relative; padding-inline-start:56px; padding-bottom:22px; }
  .step:not(:last-child)::before { content:""; position:absolute; inset-inline-start:17px; top:50px; bottom:0; width:2px; background:var(--line); }
  .mk { position:absolute; inset-inline-start:0; top:10px; width:36px; height:36px; border-radius:50%; background:var(--paper); border:2px solid var(--line); display:grid; place-items:center; font-weight:600; color:var(--muted); }
  .step.active .mk { background:var(--green); border-color:var(--green); color:#fff; }
  .step.done .mk { border-color:var(--green); color:var(--green); font-size:0; }
  .step.done .mk::after { content:"✓"; font-size:17px; }
  .panel { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .panel h2 { font-family:var(--serif); font-size:24px; line-height:1.4; margin:0 0 6px; }
  details.cover { margin-top:16px; border:1px solid var(--line); border-radius:8px; padding:0 14px 14px; }
  details.cover summary { cursor:pointer; font-weight:600; padding:12px 0; }
  .hint { color:var(--muted); font-size:14px; margin:0 0 8px; }

  label { display:block; font-weight:600; margin:14px 0 4px; font-size:15px; }
  input, select { width:100%; font:inherit; font-size:16px; padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  input::placeholder { color:#8a9690; }
  :focus-visible { outline:3px solid var(--brass); outline-offset:2px; }
  input:focus-visible { outline-offset:0; border-color:var(--green); }
  .row { display:flex; gap:12px; } .row > div { flex:1; min-width:0; }

  button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:11px 20px; cursor:pointer; background:var(--green); color:#fff; }
  button:hover { background:var(--green-d); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.ghost:hover { background:var(--sage); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }

  /* قائمة الخطة */
  .sec-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .sec-row .no { flex:none; width:26px; text-align:center; color:var(--muted); font-weight:600; }
  .sec-row input { flex:1; min-width:0; }
  .sec-row button { padding:9px 14px; }
  .sec-row .lbl { flex:none; width:84px; font-size:13px; font-weight:600; color:var(--muted); }
  .sec-row.matlab { margin-inline-start:18px; } .sec-row.far3 { margin-inline-start:36px; }
  .sec-row.mabhath input { font-weight:600; border-color:var(--green); }
  .band { font-family:var(--serif); font-weight:700; font-size:22px; line-height:1.5; color:var(--green); border-bottom:2px solid var(--brass); padding:2px 0 6px; margin:26px 0 12px; }
  .band.sub { font-size:19px; border-bottom:1px solid var(--line); margin:18px 0 10px; margin-inline-start:14px; }

  /* الأوراق: كل قسم ورقة بهامش مزدوج كأوراق المذكرات القانونية */
  .progress-line { display:flex; align-items:center; gap:12px; margin:12px 0 16px; }
  .status { font-size:14px; color:var(--muted); flex:1; min-height:24px; }
  .bar { width:96px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar span { display:block; height:100%; width:0; background:var(--green); transition:width .4s; }
  .sheet { position:relative; background:#fff; border:1px solid var(--line); border-radius:4px; margin-bottom:14px; padding:12px 0 14px; }
  .sheet::before, .sheet::after { content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--brass); opacity:.7; }
  .sheet::before { inset-inline-start:40px; } .sheet::after { inset-inline-start:44px; }
  .sheet-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding-inline:58px 16px; }
  .sheet-head h3 { font-family:var(--serif); font-size:21px; line-height:1.5; margin:0; }
  .state { flex:none; font-size:13px; color:var(--muted); }
  .sheet.writing .state { color:var(--green); font-weight:600; }
  .sheet.writing .state::before { content:""; display:inline-block; width:8px; height:8px; margin-inline-end:6px; border-radius:50%; background:var(--brass); animation:pulse 1s infinite alternate; }
  .sheet.done .state { color:var(--green); }
  .sheet textarea { display:block; width:100%; min-height:200px; resize:vertical; border:0; background:transparent; border-radius:0; font-family:var(--serif); font-size:19px; line-height:2.1; padding:6px 58px 6px 16px; color:var(--ink); }
  .sheet textarea:focus-visible { outline:0; background:#fbfcfb; }
  @keyframes pulse { from { opacity:.3; } to { opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .sheet.writing .state::before { animation:none; } .bar span { transition:none; } }

  .note { font-size:14px; color:var(--muted); border-inline-start:3px solid var(--brass); padding-inline-start:12px; margin:16px 0 0; }
  .err { background:var(--danger-bg); color:var(--danger); border:1px solid #f0bdb8; padding:12px 16px; border-radius:8px; margin-bottom:18px; display:none; font-weight:500; }
  .hidden { display:none; }

  @media (max-width:520px) {
    .top svg { width:42px; height:42px; }
    .step { padding-inline-start:46px; } .mk { width:32px; height:32px; }
    .step:not(:last-child)::before { inset-inline-start:15px; top:46px; }
    .panel { padding:16px; }
    .row { flex-direction:column; gap:0; }
    .sec-row .lbl { width:62px; font-size:12px; }
    .sec-row.matlab { margin-inline-start:8px; } .sec-row.far3 { margin-inline-start:16px; }
    .sheet-head { padding-inline:54px 12px; }
    .sheet textarea { padding-right:54px; font-size:18px; }
    .sheet::before { inset-inline-start:36px; } .sheet::after { inset-inline-start:40px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <svg viewBox="0 0 64 64" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M32 8v44M20 52h24M12 18h40"/>
      <path d="M12 18L5 34a7 7 0 0014 0L12 18zM52 18l-7 16a7 7 0 0014 0l-7-16z"/>
    </svg>
    <div>
      <h1>مولّد الأبحاث الجامعية</h1>
      <p class="sub">أدخل العنوان، راجع الخطة، ثم ولّد الأقسام وصدّرها بصيغة Word.</p>
    </div>
  </div>
</header>

<main>
  <div id="err" class="err" role="alert"></div>

  <section class="step active" id="step1">
    <span class="mk" aria-hidden="true">١</span>
    <div class="panel">
      <h2>بيانات البحث</h2>
      <label for="title">عنوان البحث</label>
      <input id="title" maxlength="200" placeholder="مثال: الطبيعة القانونية للشركة ذات المسؤولية المحدودة في القانون الجزائري">
      <div class="row">
        <div><label for="field">التخصص</label><input id="field" maxlength="100" placeholder="القانون التجاري"></div>
        <div><label for="pages">عدد الصفحات التقريبي</label><input id="pages" type="number" inputmode="numeric" min="4" max="60" value="10"></div>
      </div>
      <label for="university">الجامعة</label>
      <input id="university" list="univList" maxlength="120" autocomplete="off" placeholder="اختر من القائمة أو اكتب اسم جامعتك">
      <datalist id="univList">
        <option value="جامعة الجزائر 1 بن يوسف بن خدة">
        <option value="جامعة الجزائر 2 أبو القاسم سعد الله">
        <option value="جامعة الجزائر 3 إبراهيم سلطان شيبوط">
        <option value="جامعة هواري بومدين للعلوم والتكنولوجيا">
        <option value="جامعة البليدة 1 سعد دحلب">
        <option value="جامعة البليدة 2 علي لونيسي">
        <option value="جامعة بومرداس أحمد بوقرة">
        <option value="جامعة تيزي وزو مولود معمري">
        <option value="جامعة بجاية عبد الرحمان ميرة">
        <option value="جامعة وهران 1 أحمد بن بلة">
        <option value="جامعة وهران 2 محمد بن أحمد">
        <option value="جامعة تلمسان أبو بكر بلقايد">
        <option value="جامعة سيدي بلعباس جيلالي ليابس">
        <option value="جامعة مستغانم عبد الحميد بن باديس">
        <option value="جامعة معسكر مصطفى اسطمبولي">
        <option value="جامعة تيارت ابن خلدون">
        <option value="جامعة الشلف حسيبة بن بوعلي">
        <option value="جامعة قسنطينة 1 الإخوة منتوري">
        <option value="جامعة قسنطينة 3 صالح بوبنيدر">
        <option value="جامعة عنابة باجي مختار">
        <option value="جامعة باتنة 1 الحاج لخضر">
        <option value="جامعة سطيف 2 محمد لمين دباغين">
        <option value="جامعة بسكرة محمد خيضر">
        <option value="جامعة ورقلة قاصدي مرباح">
        <option value="جامعة الجلفة زيان عاشور">
        <option value="جامعة الأغواط عمار ثليجي">
        <option value="جامعة المسيلة محمد بوضياف">
        <option value="جامعة جيجل محمد الصديق بن يحيى">
        <option value="جامعة قالمة 8 ماي 1945">
        <option value="جامعة تبسة العربي التبسي">
        <option value="جامعة سعيدة الدكتور مولاي الطاهر">
        <option value="جامعة غرداية">
        <option value="جامعة الوادي الشهيد حمه لخضر">
        <option value="جامعة أدرار أحمد دراية">
      </datalist>
      <details class="cover">
        <summary>بيانات الغلاف (اختيارية)</summary>
        <div class="row">
          <div><label for="faculty">الكلية</label><input id="faculty" maxlength="120" placeholder="الحقوق والعلوم السياسية"></div>
          <div><label for="department">القسم</label><input id="department" maxlength="120" placeholder="الحقوق"></div>
        </div>
        <div class="row">
          <div><label for="student">اسم الطالب</label><input id="student" maxlength="100"></div>
          <div><label for="supervisor">الأستاذ المشرف</label><input id="supervisor" maxlength="100"></div>
        </div>
        <label for="year">السنة الجامعية</label>
        <input id="year" maxlength="30" placeholder="2026/2027">
      </details>
      <label for="plan">نوع الخطة</label>
      <select id="plan">
        <option value="binary">ثنائية: مبحثان، لكل مبحث مطلبان، ولكل مطلب فرعان</option>
        <option value="flat">أقسام حرّة: مقدمة ومباحث وخاتمة</option>
      </select>
      <div class="actions"><button id="btnOutline">توليد خطة البحث</button></div>
    </div>
  </section>

  <section class="step hidden" id="step2">
    <span class="mk" aria-hidden="true">٢</span>
    <div class="panel">
      <h2>خطة البحث</h2>
      <p class="hint" id="outlineHint"></p>
      <div id="outline"></div>
      <div class="actions">
        <button class="ghost" id="btnAdd">إضافة قسم</button>
        <button id="btnSections">توليد الأقسام</button>
      </div>
    </div>
  </section>

  <section class="step hidden" id="step3">
    <span class="mk" aria-hidden="true">٣</span>
    <div class="panel">
      <h2>النص</h2>
      <div class="progress-line">
        <div id="progress" class="status"></div>
        <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
      </div>
      <div id="sections"></div>
      <p class="note">النص مولَّد بالذكاء الاصطناعي وقد يحتوي أخطاءً. راجعه وتحقق من كل مادة قانونية ومرجع قبل الاعتماد عليه.</p>
      <div class="actions"><button id="btnExport" disabled>تصدير Word</button></div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let outline = [];   // [{title, summary}]
let bodies = [];    // نصوص الأقسام

function showError(msg) { const e = $('#err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; if (msg) window.scrollTo({ top: 0, behavior: 'smooth' }); }

function setStep(n) {
  [1, 2, 3].forEach(i => {
    const el = $('#step' + i);
    el.classList.toggle('active', i === n);
    el.classList.toggle('done', i < n);
  });
}
function reveal(id) {
  const el = $(id); el.classList.remove('hidden');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }), 50);
}

async function post(path, payload) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!r.ok) {
    let m = 'حدث خطأ.'; try { m = (await r.json()).error || m; } catch {}
    throw new Error(m);
  }
  return r;
}
const COVER = ['university', 'faculty', 'department', 'student', 'supervisor', 'year'];
try {
  const saved = JSON.parse(localStorage.getItem('cover') || '{}');
  COVER.forEach(k => { if (saved[k]) $('#' + k).value = saved[k]; });
} catch {}
COVER.forEach(k => $('#' + k).addEventListener('input', () => {
  try { localStorage.setItem('cover', JSON.stringify(Object.fromEntries(COVER.map(c => [c, $('#' + c).value.trim()])))); } catch {}
}));
const meta = () => ({
  title: $('#title').value.trim(), field: $('#field').value.trim(), pages: $('#pages').value, plan: $('#plan').value,
  ...Object.fromEntries(COVER.map(k => [k, $('#' + k).value.trim()])),
});
const isBinary = () => outline.some(s => s.kind === 'mabhath');
const isHead = s => s.kind === 'mabhath' || s.kind === 'matlab';
const fullTitle = s => s.label ? `${s.label}: ${s.title}` : s.title;

function renderOutline() {
  const box = $('#outline'); box.replaceChildren();
  const bin = isBinary();
  $('#btnAdd').classList.toggle('hidden', bin);
  $('#outlineHint').textContent = bin
    ? 'الخطة ثنائية: مبحثان، لكل مبحث مطلبان، ولكل مطلب فرعان. عدّل العناوين كما تشاء، وسيُكتب النص في المقدمة والفروع والخاتمة.'
    : 'عدّل العناوين أو احذف أو أضف ما تريد قبل توليد النص.';
  outline.forEach((s, i) => {
    const row = document.createElement('div'); row.className = 'sec-row ' + (s.kind || 'section');
    const lbl = document.createElement('span');
    lbl.className = bin ? 'lbl' : 'no';
    lbl.textContent = bin ? (s.label || '') : (i + 1).toLocaleString('ar-EG');
    const inp = document.createElement('input'); inp.value = s.title; inp.maxLength = 150;
    inp.setAttribute('aria-label', (s.label ? s.label + ': ' : 'عنوان القسم ') + (s.label ? '' : (i + 1)));
    inp.addEventListener('input', () => { outline[i].title = inp.value; });
    row.append(lbl, inp);
    if (!bin) {
      const del = document.createElement('button'); del.className = 'ghost'; del.textContent = 'حذف';
      del.addEventListener('click', () => { outline.splice(i, 1); renderOutline(); });
      row.append(del);
    }
    box.append(row);
  });
}

$('#title').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnOutline').click(); });

$('#btnOutline').addEventListener('click', async () => {
  showError('');
  const m = meta();
  if (!m.title) return showError('أدخل عنوان البحث.');
  const b = $('#btnOutline'); b.disabled = true; b.textContent = 'جارٍ التوليد…';
  try {
    outline = (await (await post('/api/outline', m)).json()).sections;
    renderOutline(); $('#step3').classList.add('hidden');
    setStep(2); reveal('#step2');
  } catch (e) { showError(e.message); }
  b.disabled = false; b.textContent = 'توليد خطة البحث';
});

$('#btnAdd').addEventListener('click', () => { outline.push({ kind: 'section', label: '', title: '', summary: '' }); renderOutline(); const ins = $('#outline').querySelectorAll('input'); ins[ins.length - 1].focus(); });

$('#btnSections').addEventListener('click', async () => {
  showError('');
  const bin = isBinary();
  if (bin) { if (outline.some(s => !s.title.trim())) return showError('لا تترك أي عنوان فارغًا في الخطة.'); }
  else outline = outline.filter(s => s.title.trim());
  if (outline.length < 2) return showError('أبقِ قسمين على الأقل.');
  const b = $('#btnSections'); b.disabled = true;
  setStep(3); reveal('#step3'); $('#btnExport').disabled = true; $('#barFill').style.width = '0';
  const box = $('#sections'); box.replaceChildren();
  bodies = outline.map(() => '');
  const total = outline.filter(s => !isHead(s)).length;
  const sheets = {};
  outline.forEach((s, i) => {
    if (isHead(s)) {
      const band = document.createElement('div'); band.className = 'band' + (s.kind === 'matlab' ? ' sub' : '');
      band.textContent = fullTitle(s); box.append(band); return;
    }
    const sheet = document.createElement('div'); sheet.className = 'sheet';
    const head = document.createElement('div'); head.className = 'sheet-head';
    const h = document.createElement('h3'); h.textContent = fullTitle(s);
    const st = document.createElement('span'); st.className = 'state'; st.textContent = 'في الانتظار';
    head.append(h, st);
    const t = document.createElement('textarea'); t.setAttribute('aria-label', fullTitle(s));
    t.addEventListener('input', () => { bodies[i] = t.value; });
    sheet.append(head, t); box.append(sheet);
    sheets[i] = { sheet, st, t };
  });
  const titles = outline.map(fullTitle);
  let failedAt = -1, done = 0, mabhath = '', matlab = '';
  try {
    for (let i = 0; i < outline.length; i++) {
      const s = outline[i];
      if (s.kind === 'mabhath') { mabhath = fullTitle(s); matlab = ''; }
      if (s.kind === 'matlab') matlab = fullTitle(s);
      if (isHead(s)) continue;
      failedAt = i;
      sheets[i].sheet.classList.add('writing'); sheets[i].st.textContent = 'تُكتب الآن…';
      $('#progress').textContent = `جارٍ كتابة القسم ${done + 1} من ${total}…`;
      const parents = s.kind === 'far3' ? [mabhath, matlab] : [];
      const r = await (await post('/api/section', { ...meta(), section: { ...s, parents }, outline: titles, units: total })).json();
      bodies[i] = r.text; sheets[i].t.value = r.text;
      sheets[i].sheet.classList.remove('writing'); sheets[i].sheet.classList.add('done'); sheets[i].st.textContent = 'جاهز';
      done++; $('#barFill').style.width = Math.round((done / total) * 100) + '%';
    }
    failedAt = -1;
    $('#progress').textContent = 'اكتمل التوليد. يمكنك تعديل أي نص قبل التصدير.';
  } catch (e) {
    if (failedAt >= 0) { sheets[failedAt].sheet.classList.remove('writing'); sheets[failedAt].st.textContent = 'توقّف'; }
    showError(e.message + ' (الأقسام المكتملة محفوظة، يمكنك إعادة الضغط للمتابعة من البداية.)');
    $('#progress').textContent = '';
  }
  $('#btnExport').disabled = !bodies.some(Boolean);
  b.disabled = false;
});

$('#btnExport').addEventListener('click', async () => {
  showError('');
  const sections = outline.map((s, i) => ({ kind: s.kind || 'section', label: s.label || '', title: s.title, body: bodies[i] })).filter(s => s.body || isHead(s));
  try {
    const r = await post('/api/export', { ...meta(), sections });
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a'); a.href = url; a.download = 'research.docx'; a.click();
    URL.revokeObjectURL(url);
  } catch (e) { showError(e.message); }
});
</script>
</body>
</html>
